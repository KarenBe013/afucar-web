<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFUCAR — Próximamente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#0a1f38;
  --navy:#0f2a4a;
  --gold:#c9a227;
  --gold-soft:#e8c766;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(180deg, rgba(10,31,56,.92) 0%, rgba(15,42,74,.9) 55%, var(--navy) 100%),
    url('palacio-legislativo.jpg') center 30% / cover no-repeat;
  color:#fff;
  text-align:center;
  padding:28px;
}
.wrap{max-width:560px;}
.icon{width:74px;height:74px;color:var(--gold);margin-bottom:18px;}
.eyebrow{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:#9fb0c8;font-weight:500;margin-bottom:10px;
}
.wordmark{
  font-family:'Source Serif 4',serif;font-weight:700;
  font-size:clamp(34px,6vw,52px);letter-spacing:.02em;
  margin-bottom:22px;text-shadow:0 4px 24px rgba(0,0,0,.35);
}
h1{
  font-family:'Source Serif 4',serif;font-weight:600;
  font-size:clamp(20px,3.2vw,28px);margin-bottom:16px;line-height:1.3;
}
p{
  font-size:15px;color:#c6cedb;line-height:1.6;margin-bottom:8px;
}
.linea{
  width:60px;height:2px;background:var(--gold);margin:26px auto;
}
.contacto{
  margin-top:10px;font-size:13.5px;color:#9fb0c8;
}
.contacto a{color:var(--gold-soft);text-decoration:none;font-weight:600;}
.contacto a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="wrap">
  <svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="AFUCAR">
    <path d="M6 17 L24 6 L42 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="17" x2="44" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="10" y1="20" x2="10" y2="38" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="17.5" y1="20" x2="17.5" y2="38" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="24" y1="20" x2="24" y2="38" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="30.5" y1="20" x2="30.5" y2="38" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="38" y1="20" x2="38" y2="38" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="4" y1="40" x2="44" y2="40" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

  <div class="eyebrow">Asociación de Funcionarios de la Cámara de Representantes</div>
  <div class="wordmark">AFUCAR</div>

  <div class="linea"></div>

  <h1>Estamos preparando algo nuevo</h1>
  <p>Muy pronto vas a poder acceder a toda la información de la asociación, reservar el salón, consultar convenios y mucho más, desde este mismo sitio.</p>

  <div class="contacto">
    Mientras tanto, escribinos a <a href="mailto:afucar@gmail.com">afucar@gmail.com</a>
  </div>
</div>

</body>
</html>
