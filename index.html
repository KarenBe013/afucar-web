<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asociación - Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Bienvenido</h1>

  <div id="g_id_onload"
       data-client_id="622049183176-plh0dvcvhnubd2ahhj5k956tuvrmot8v.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="contenido"></div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzZ009FYc_YZvmD1jZ7L4VL-lSPJ5fubtDFpSsKBaAirAt8PpzP0S6_GZBt8dHkXVEp/exec";

    let categoriasDescuento = [];

    function handleCredentialResponse(response) {
      const datos = JSON.parse(atob(response.credential.split('.')[1]));
      const email = datos.email;
      const nombre = datos.name;

      document.getElementById('contenido').innerText = "Verificando usuario...";

      fetch(`${URL_BACKEND}?accion=buscarUsuario&email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(data => {
          if (data.existe) {
            mostrarUsuarioExistente(data, email);
          } else {
            mostrarFormularioRegistro(email, nombre);
          }
        })
        .catch(err => {
          document.getElementById('contenido').innerText = "Error al conectar con el servidor.";
          console.error(err);
        });
    }

    function mostrarUsuarioExistente(data, email) {
      document.getElementById('contenido').innerHTML = `
        <p>Hola ${data.nombre} ${data.apellido} (${email})</p>
        <p>Categoría: ${data.categoria_solicitada} — Estado: ${data.estado_categoria}</p>
      `;
    }

    function mostrarFormularioRegistro(email, nombreGoogle) {
      document.getElementById('contenido').innerHTML = `
        <h2>Completa tu registro</h2>
        <form id="formRegistro">
          <input type="hidden" id="email" value="${email}">
          <p><input type="text" id="nombre" placeholder="Nombre" value="${nombreGoogle}" required></p>
          <p><input type="text" id="apellido" placeholder="Apellido" required></p>
          <p><input type="text" id="ci" placeholder="Cédula de Identidad" required></p>
          <p><input type="text" id="telefono" placeholder="Teléfono" required></p>
          <p>
            <label>Categoría:</label>
            <select id="categoria">
              <option value="particular">Particular</option>
              <option value="socio">Socio</option>
              <option value="convenio">Convenio / Asociación</option>
            </select>
          </p>

          <div id="bloqueConvenio" style="display:none;">
            <p>
              <label>¿Cuál institución?</label>
              <select id="institucion"></select>
            </p>
            <div id="bloqueComprobante" style="display:none;">
              <p id="labelComprobante"></p>
              <p><input type="file" id="comprobante" accept="image/*,.pdf"></p>
            </div>
          </div>

          <button type="submit">Registrarme</button>
        </form>
        <p id="mensajeRegistro"></p>
      `;

      fetch(`${URL_BACKEND}?accion=obtenerCategoriasDescuento`)
        .then(res => res.json())
        .then(data => {
          categoriasDescuento = data.categorias || [];
          const select = document.getElementById('institucion');
          categoriasDescuento.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.nombre;
            select.appendChild(opt);
          });
        });

      const elCategoria = document.getElementById('categoria');
      const bloqueConvenio = document.getElementById('bloqueConvenio');
      const bloqueComprobante = document.getElementById('bloqueComprobante');
      const labelComprobante = document.getElementById('labelComprobante');
      const elInstitucion = document.getElementById('institucion');

      elCategoria.addEventListener('change', () => {
        bloqueConvenio.style.display = elCategoria.value === 'convenio' ? 'block' : 'none';
        actualizarBloqueComprobante();
      });

      elInstitucion.addEventListener('change', actualizarBloqueComprobante);

      function actualizarBloqueComprobante() {
        const inst = categoriasDescuento.find(c => c.id === elInstitucion.value);
        if (inst && inst.requiere_comprobante === 'SI') {
          bloqueComprobante.style.display = 'block';
          labelComprobante.textContent = `Subí: ${inst.tipo_comprobante}`;
        } else {
          bloqueComprobante.style.display = 'none';
        }
      }

      document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();

        const categoria = elCategoria.value;
        const inst = categoria === 'convenio' ? categoriasDescuento.find(c => c.id === elInstitucion.value) : null;
        const requiereComprobante = inst && inst.requiere_comprobante === 'SI';
        const archivoInput = document.getElementById('comprobante');

        if (requiereComprobante && (!archivoInput.files || archivoInput.files.length === 0)) {
          alert('Para esta institución es obligatorio subir el comprobante indicado.');
          return;
        }

        document.getElementById('mensajeRegistro').textContent = "Registrando...";

        function enviarRegistro(comprobanteData) {
          const body = {
            accion: 'registrarUsuario',
            email: document.getElementById('email').value,
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            ci: document.getElementById('ci').value,
            telefono: document.getElementById('telefono').value,
            categoria_solicitada: categoria,
            id_convenio: categoria === 'convenio' ? elInstitucion.value : '',
            comprobante: comprobanteData
          };

          fetch(URL_BACKEND, {
            method: 'POST',
            body: JSON.stringify(body)
          })
          .then(res => res.json())
          .then(data => {
            document.getElementById('mensajeRegistro').textContent = "¡Registro exitoso! Recargá la página e ingresá de nuevo.";
          })
          .catch(err => {
            document.getElementById('mensajeRegistro').textContent = "Error al registrar.";
            console.error(err);
          });
        }

        if (requiereComprobante) {
          const archivo = archivoInput.files[0];
          const lector = new FileReader();
          lector.onload = function() {
            const base64 = lector.result.split(',')[1];
            enviarRegistro({
              base64: base64,
              nombreArchivo: archivo.name,
              mimeType: archivo.type
            });
          };
          lector.readAsDataURL(archivo);
        } else {
          enviarRegistro(null);
        }
      });
    }
  </script>
</body>
</html>
