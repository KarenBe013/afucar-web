    let categoriasDescuento = [];

    function handleCredentialResponse(response) {
      const datos = JSON.parse(atob(response.credential.split('.')[1]));
      const email = datos.email;
      const nombre = datos.name;

      document.getElementById('contenido').innerText = "Verificando usuario...";

      fetch(`${URL_BACKEND}?accion=buscarUsuario&email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(data => {
          if (data.existe) {
            mostrarUsuarioExistente(data, email);
          } else {
            mostrarFormularioRegistro(email, nombre);
          }
        })
        .catch(err => {
          document.getElementById('contenido').innerText = "Error al conectar con el servidor.";
          console.error(err);
        });
    }

    function mostrarUsuarioExistente(data, email) {
      document.getElementById('contenido').innerHTML = `
        <p>Hola ${data.nombre} ${data.apellido} (${email})</p>
        <p>Categoría: ${data.categoria_solicitada} — Estado: ${data.estado_categoria}</p>
      `;
    }
