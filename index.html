<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asociación - Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Bienvenido</h1>

  <div id="g_id_onload"
       data-client_id="622049183176-plh0dvcvhnubd2ahhj5k956tuvrmot8v.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="contenido"></div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwtA1i-fpPIS5ftIBcAPNG3lURxZ_gK2XFUoDEqFxAt1MwoAD21VysskS8owZ__TeZu/exec";

    let categoriasDescuento = [];

    function handleCredentialResponse(response) {
      const datos = JSON.parse(atob(response.credential.split('.')[1]));
      const email = datos.email;
      const nombre = datos.name;

      document.getElementById('contenido').innerText = "Verificando usuario...";

      fetch(`${URL_BACKEND}?accion=buscarUsuario&email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(data => {
          if (data.existe) {
            mostrarUsuarioExistente(data, email);
          } else {
            mostrarFormularioRegistro(email, nombre);
          }
        })
        .catch(err => {
          document.getElementById('contenido').innerText = "Error al conectar con el servidor.";
          console.error(err);
        });
    }

    function mostrarUsuarioExistente(data, email) {
  document.getElementById('contenido').innerHTML = `
    <p>Hola ${data.nombre} ${data.apellido} (${email})</p>
    <p>Categoría: ${data.categoria_solicitada} — Estado: ${data.estado_categoria}</p>
    <p><a href="#" id="btnCerrarSesion" style="color:#0f2a4a;">Cerrar sesión</a></p>

    <hr style="margin:20px 0;">

    <h3>Consultas</h3>
    <form id="formTicket">
      <p><input type="text" id="ticketAsunto" placeholder="Asunto" required style="width:100%;max-width:400px;"></p>
      <p><textarea id="ticketMensaje" placeholder="Escribí tu consulta..." rows="3" required style="width:100%;max-width:400px;"></textarea></p>
      <button type="submit">Enviar consulta</button>
    </form>
    <p id="mensajeTicket"></p>

    <div id="misTickets">Cargando tus consultas...</div>
  `;

  document.getElementById('btnCerrarSesion').addEventListener('click', function(e){
    e.preventDefault();
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
    document.getElementById('contenido').innerHTML = '<p>Sesión cerrada. Recargá la página para volver a ingresar.</p>';
  });

  document.getElementById('formTicket').addEventListener('submit', function(e){
    e.preventDefault();
    const asunto = document.getElementById('ticketAsunto').value.trim();
    const mensaje = document.getElementById('ticketMensaje').value.trim();
    document.getElementById('mensajeTicket').textContent = 'Enviando...';

    fetch(URL_BACKEND, {
      method: 'POST',
      body: JSON.stringify({
        accion: 'crearTicket',
        email: email,
        nombre: `${data.nombre} ${data.apellido}`,
        asunto: asunto,
        mensaje: mensaje
      })
    })
    .then(res => res.json())
    .then(resp => {
      if (resp.error) {
        document.getElementById('mensajeTicket').textContent = resp.error;
        return;
      }
      document.getElementById('mensajeTicket').textContent = '¡Consulta enviada! Te va a aparecer abajo con la respuesta cuando la tengamos.';
      document.getElementById('formTicket').reset();
      cargarMisTickets(email);
    })
    .catch(err => {
      document.getElementById('mensajeTicket').textContent = 'Error al enviar la consulta.';
      console.error(err);
    });
  });

  cargarMisTickets(email);
}

function cargarMisTickets(email){
  fetch(`${URL_BACKEND}?accion=obtenerTicketsUsuario&email=${encodeURIComponent(email)}`)
    .then(res => res.json())
    .then(data => {
      const tickets = data.tickets || [];
      const cont = document.getElementById('misTickets');
      if (tickets.length === 0) {
        cont.innerHTML = '<p>Todavía no hiciste ninguna consulta.</p>';
        return;
      }
      let html = '<h4>Tus consultas</h4>';
      tickets.forEach(t => {
        html += `
          <div style="border:1px solid #ccc;border-radius:4px;padding:10px;margin:10px 0;max-width:420px;">
            <strong>${t.asunto}</strong> — ${t.estado_ticket === 'respondido' ? 'Respondido' : 'Pendiente'}<br>
            <span style="font-size:13px;color:#666;">${t.fecha_creacion}</span>
            <p style="margin-top:6px;">${t.mensaje}</p>
            ${t.respuesta_admin ? `<p style="margin-top:6px;"><strong>Respuesta:</strong> ${t.respuesta_admin}</p>` : ''}
          </div>`;
      });
      cont.innerHTML = html;
    })
    .catch(err => console.error(err));
}

    function mostrarFormularioRegistro(email, nombreGoogle) {
      document.getElementById('contenido').innerHTML = `
        <h2>Completa tu registro</h2>
        <form id="formRegistro">
          <input type="hidden" id="email" value="${email}">
          <p><input type="text" id="nombre" placeholder="Nombre" value="${nombreGoogle}" required></p>
          <p><input type="text" id="apellido" placeholder="Apellido" required></p>
          <p><input type="text" id="ci" placeholder="Cédula de Identidad" required></p>
          <p><input type="text" id="telefono" placeholder="Teléfono" required></p>
          <p>
            <label>Categoría:</label>
            <select id="categoria">
              <option value="particular">Particular</option>
              <option value="socio">Socio</option>
              <option value="convenio">Convenio / Asociación</option>
            </select>
          </p>

          <div id="bloqueConvenio" style="display:none;">
            <p>
              <label>¿Cuál institución?</label>
              <select id="institucion"></select>
            </p>
            <div id="bloqueComprobante" style="display:none;">
              <p id="labelComprobante"></p>
              <p><input type="file" id="comprobante" accept="image/*,.pdf"></p>
            </div>
          </div>

          <button type="submit">Registrarme</button>
        </form>
        <p id="mensajeRegistro"></p>
      `;

      fetch(`${URL_BACKEND}?accion=obtenerCategoriasDescuento`)
        .then(res => res.json())
        .then(data => {
          categoriasDescuento = data.categorias || [];
          const select = document.getElementById('institucion');
          categoriasDescuento.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.nombre;
            select.appendChild(opt);
          });
        });

      const elCategoria = document.getElementById('categoria');
      const bloqueConvenio = document.getElementById('bloqueConvenio');
      const bloqueComprobante = document.getElementById('bloqueComprobante');
      const labelComprobante = document.getElementById('labelComprobante');
      const elInstitucion = document.getElementById('institucion');

      elCategoria.addEventListener('change', () => {
        bloqueConvenio.style.display = elCategoria.value === 'convenio' ? 'block' : 'none';
        actualizarBloqueComprobante();
      });

      elInstitucion.addEventListener('change', actualizarBloqueComprobante);

      function actualizarBloqueComprobante() {
        const inst = categoriasDescuento.find(c => c.id === elInstitucion.value);
        if (inst && inst.requiere_comprobante === 'SI') {
          bloqueComprobante.style.display = 'block';
          labelComprobante.textContent = `Subí: ${inst.tipo_comprobante}`;
        } else {
          bloqueComprobante.style.display = 'none';
        }
      }

      document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();

        const categoria = elCategoria.value;
        const inst = categoria === 'convenio' ? categoriasDescuento.find(c => c.id === elInstitucion.value) : null;
        const requiereComprobante = inst && inst.requiere_comprobante === 'SI';
        const archivoInput = document.getElementById('comprobante');

        if (requiereComprobante && (!archivoInput.files || archivoInput.files.length === 0)) {
          alert('Para esta institución es obligatorio subir el comprobante indicado.');
          return;
        }

        document.getElementById('mensajeRegistro').textContent = "Registrando...";

        function enviarRegistro(comprobanteData) {
          const body = {
            accion: 'registrarUsuario',
            email: document.getElementById('email').value,
            nombre: document.getElementById('nombre').value,
            apellido: document.getElementById('apellido').value,
            ci: document.getElementById('ci').value,
            telefono: document.getElementById('telefono').value,
            categoria_solicitada: categoria,
            id_convenio: categoria === 'convenio' ? elInstitucion.value : '',
            comprobante: comprobanteData
          };

          fetch(URL_BACKEND, {
            method: 'POST',
            body: JSON.stringify(body)
          })
          .then(res => res.json())
          .then(data => {
            document.getElementById('mensajeRegistro').textContent = "¡Registro exitoso! Recargá la página e ingresá de nuevo.";
          })
          .catch(err => {
            document.getElementById('mensajeRegistro').textContent = "Error al registrar.";
            console.error(err);
          });
        }

        if (requiereComprobante) {
          const archivo = archivoInput.files[0];
          const lector = new FileReader();
          lector.onload = function() {
            const base64 = lector.result.split(',')[1];
            enviarRegistro({
              base64: base64,
              nombreArchivo: archivo.name,
              mimeType: archivo.type
            });
          };
          lector.readAsDataURL(archivo);
        } else {
          enviarRegistro(null);
        }
      });
    }
  </script>
</body>
</html>
